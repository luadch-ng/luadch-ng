name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      # Build (without creating a release) on every push to a release/*
      # branch, so we can verify the pipeline before tagging. The release
      # job is gated on "refs/tags/v*" so it only fires for real tag pushes.
      - 'release/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for filename (used only for manual test runs; no GitHub release is created without a real tag push)'
        required: false
        default: 'v0.0.0-test'

permissions:
  # Least privilege: only the release job needs write (to create the GitHub
  # release). The build jobs just upload artifacts - and build-openwrt runs a
  # downloaded OpenWRT SDK toolchain, which should not carry a repo-write token.
  contents: read

env:
  # Run JavaScript-based actions on Node.js 24 instead of the default
  # Node.js 20. GitHub will switch the default in mid-2026; setting this
  # explicitly avoids the deprecation warning and keeps us off the
  # to-be-removed runtime. See:
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        # zlib1g-dev is REQUIRED, not optional: CMakeLists.txt does
        # find_package(ZLIB REQUIRED) for the zlib_stream module, and the
        # dev package is what ships zlib.h + the libz.so link. The runtime
        # zlib1g is present on every box (half of userspace links it), but
        # build-essential does NOT depend on zlib1g-dev - so configure fails
        # without this line. Keep in sync with smoke.yml + docker/Dockerfile.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install into staging tree
        run: cmake --install build

      - name: Verify install tree
        run: |
          test -f build/install/luadch/luadch
          test -f build/install/luadch/liblua.so
          test -d build/install/luadch/scripts
          test -d build/install/luadch/cfg
          test -d build/install/luadch/certs

      - name: Determine version tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Branch push: derive "vX.Y.Z-dev" from a "release/vX.Y.Z" branch.
            BRANCH="${GITHUB_REF_NAME}"
            TAG="${BRANCH#release/}-dev"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: tar czf "luadch-${{ steps.tag.outputs.tag }}-linux-x86_64.tar.gz" -C build/install luadch

      - uses: actions/upload-artifact@v4
        with:
          name: luadch-linux-x86_64
          path: luadch-*-linux-x86_64.tar.gz
          if-no-files-found: error

  build-linux-aarch64:
    name: Build Linux aarch64 (Bullseye container, glibc 2.31)
    # GitHub-hosted native aarch64 runner (Cobalt 100, available on
    # public repos since 2025). Closes #159 (Pi pre-compiled). Covers
    # Pi 3+ / 4 / 5 / Zero 2W with a 64-bit OS.
    #
    # Build runs inside a Debian Bullseye container (glibc 2.31)
    # because Sopor's report on #159 showed v3.1.9 broke on Pi systems
    # with glibc < 2.34. Even fresh Pi OS Bookworm (glibc 2.36) failed
    # because our liblua.so referenced GLIBC_2.38 (built on
    # ubuntu-24.04 = glibc 2.39). Bullseye gives the broadest Pi-base
    # coverage: it works on Pi OS Bullseye / DietPi v9.x (glibc 2.31)
    # AND forward-compatibly on Bookworm (2.36) and any newer system.
    #
    # OpenSSL 3.x is required (CMakeLists.txt enforces >= 3.0; F-DEP-4
    # of Phase 7). Bullseye only ships OpenSSL 1.1.1, so we build 3.x
    # from source inside the container and bundle libssl.so.3 +
    # libcrypto.so.3 alongside the binary in the tarball (same pattern
    # as the Windows build's libssl-3-x64.dll). rpath is patched to
    # `$ORIGIN` for the binary and `$ORIGIN/../../..` for luasec's
    # ssl.so so they find the bundled libs.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:bullseye-slim
    env:
      # Pinned OpenSSL 3.0.x LTS (security-maintained until 2026-09-07).
      # Bump on advisory. Source integrity is verified against the
      # SHA256 sum that openssl.org publishes alongside the tarball;
      # both files travel over HTTPS so the trust chain is the
      # openssl.org cert.
      OPENSSL_VERSION: 3.0.16
      OPENSSL_PREFIX: /opt/openssl3
      # Bullseye ships cmake 3.18 but luadch needs >= 3.20.
      # bullseye-backports is no longer served (archived after Bullseye
      # went oldoldstable in 2024), so pull Kitware's official aarch64
      # binary tarball instead.
      CMAKE_VERSION: 3.30.5
    steps:
      - name: Install build dependencies
        # Retry apt-get update to absorb a transient deb.debian.org
        # outage - the release pipeline should not break on one
        # network blip.
        run: |
          for i in 1 2 3; do
            apt-get update && break
            echo "apt-get update failed, retrying in 5s..."
            sleep 5
          done
          apt-get install -y --no-install-recommends \
            build-essential perl wget ca-certificates \
            patchelf file git zlib1g-dev

      - name: Install CMake ${{ env.CMAKE_VERSION }} (Kitware aarch64 binary)
        # Bullseye's stock cmake (3.18) is too old for cmake_minimum_required(3.20).
        # Integrity is verified against the SHA-256 sums file Kitware
        # publishes alongside the tarball on the GitHub release.
        run: |
          cd /tmp
          BASE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}"
          wget -q "${BASE_URL}/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
          wget -q "${BASE_URL}/cmake-${CMAKE_VERSION}-SHA-256.txt"
          # The SHA-256 file lists hashes for every platform's tarball;
          # --ignore-missing skips the entries for files we did not
          # download (x86_64, macOS, etc.), so we only check our own.
          sha256sum --ignore-missing -c "cmake-${CMAKE_VERSION}-SHA-256.txt"
          tar xzf "cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz" -C /opt
          ln -s "/opt/cmake-${CMAKE_VERSION}-linux-aarch64/bin/cmake" /usr/local/bin/cmake
          cmake --version

      - uses: actions/checkout@v4

      - name: Build OpenSSL 3.x from source
        # Bullseye ships OpenSSL 1.1.1 (EOL 2023-09-11); we need 3.0+.
        # Built shared at /opt/openssl3 and bundled below.
        run: |
          cd /tmp
          BASE_URL="https://www.openssl.org/source"
          wget -q "${BASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz"
          wget -q "${BASE_URL}/openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          # openssl.org publishes hashes in the standard sha256sum
          # format: `<hex>  <filename>` - feed directly to `sha256sum -c`.
          sha256sum -c "openssl-${OPENSSL_VERSION}.tar.gz.sha256"
          tar xzf "openssl-${OPENSSL_VERSION}.tar.gz"
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure linux-aarch64 \
            --prefix="${OPENSSL_PREFIX}" \
            --openssldir="${OPENSSL_PREFIX}/ssl" \
            --libdir=lib \
            shared no-tests
          make -j"$(nproc)"
          make install_sw

      - name: Configure luadch
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR="${OPENSSL_PREFIX}"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Install into staging tree
        run: cmake --install build

      - name: Verify install tree
        run: |
          test -f build/install/luadch/luadch
          test -f build/install/luadch/liblua.so
          test -d build/install/luadch/scripts
          test -d build/install/luadch/cfg
          test -d build/install/luadch/certs
          test -f build/install/luadch/lib/adclib/adclib.so
          test -f build/install/luadch/lib/luasec/ssl/ssl.so

      - name: Verify binary is aarch64
        run: |
          file build/install/luadch/luadch | grep -q "ARM aarch64"

      - name: Bundle OpenSSL libs alongside binary
        # Same pattern as the Windows build's libssl-3-x64.dll /
        # libcrypto-3-x64.dll: ship the .so.3 files at the tarball
        # root so the binary and luasec's ssl.so find them via rpath
        # without depending on the user's system OpenSSL version
        # (Bullseye-based Pi systems ship libssl1.1, not libssl3).
        run: |
          cp -L "${OPENSSL_PREFIX}/lib/libssl.so.3" build/install/luadch/
          cp -L "${OPENSSL_PREFIX}/lib/libcrypto.so.3" build/install/luadch/
          chmod 644 build/install/luadch/libssl.so.3 build/install/luadch/libcrypto.so.3

      - name: Patch rpath on all SSL-linked artifacts
        # The bundled libssl.so.3 / libcrypto.so.3 live at the tarball
        # root, alongside the luadch binary and liblua.so. Every ELF
        # object that has libssl or libcrypto in its NEEDED list needs
        # an rpath / RUNPATH set so the dynamic loader finds the
        # bundled libs at runtime (DT_RUNPATH is NOT inherited from
        # the caller, so each consumer must declare its own search
        # path).
        #
        # Linked-against-OpenSSL artifacts and their level relative
        # to <root>:
        #   <root>/luadch                       -> $ORIGIN
        #   <root>/libssl.so.3                  -> $ORIGIN (needs libcrypto)
        #   <root>/lib/adclib/adclib.so         -> $ORIGIN/../..
        #   <root>/lib/luasec/ssl/ssl.so        -> $ORIGIN/../../..
        run: |
          patchelf --set-rpath '$ORIGIN'           build/install/luadch/luadch
          patchelf --set-rpath '$ORIGIN'           build/install/luadch/libssl.so.3
          patchelf --set-rpath '$ORIGIN/../..'     build/install/luadch/lib/adclib/adclib.so
          patchelf --set-rpath '$ORIGIN/../../..' build/install/luadch/lib/luasec/ssl/ssl.so

      - name: Verify glibc baseline (must be <= 2.31)
        # Catches a regression where someone bumps the container away
        # from Bullseye without thinking. Fails the build if any of
        # the native binaries we ship requires a glibc symbol newer
        # than 2.31. Covers the main binary + every shipped .so that
        # links against libc (liblua, adclib, luasec ssl). The
        # bundled libssl.so.3 / libcrypto.so.3 also link libc but
        # they were built in the same container, so they share the
        # same glibc baseline by construction - re-checking them
        # here would only catch a corrupt bundle, which is unlikely.
        run: |
          MAX_GLIBC=$(objdump -T \
              build/install/luadch/luadch \
              build/install/luadch/liblua.so \
              build/install/luadch/lib/adclib/adclib.so \
              build/install/luadch/lib/luasec/ssl/ssl.so \
              2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "highest GLIBC symbol required across binary + liblua + adclib + luasec: ${MAX_GLIBC}"
          if [ "$(printf '%s\nGLIBC_2.31\n' "${MAX_GLIBC}" | sort -V | tail -1)" != "GLIBC_2.31" ]; then
            echo "ERROR: binary requires ${MAX_GLIBC} > GLIBC_2.31 (Bullseye baseline)" >&2
            exit 1
          fi

      - name: Determine version tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Branch push: derive "vX.Y.Z-dev" from a "release/vX.Y.Z" branch.
            BRANCH="${GITHUB_REF_NAME}"
            TAG="${BRANCH#release/}-dev"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: tar czf "luadch-${{ steps.tag.outputs.tag }}-linux-aarch64.tar.gz" -C build/install luadch

      - uses: actions/upload-artifact@v4
        with:
          name: luadch-linux-aarch64
          path: luadch-*-linux-aarch64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64 (MinGW UCRT64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-zlib
            zip

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=/ucrt64

      - name: Build
        run: cmake --build build -j

      - name: Install into staging tree
        run: cmake --install build

      - name: Verify install tree
        run: |
          test -f build/install/luadch/Luadch.exe
          test -f build/install/luadch/lua.dll
          test -f build/install/luadch/libssl-3-x64.dll
          test -f build/install/luadch/libcrypto-3-x64.dll
          test -d build/install/luadch/scripts
          test -d build/install/luadch/cfg
          test -d build/install/luadch/certs

      - name: Determine version tag
        id: tag
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            # Branch push: derive "vX.Y.Z-dev" from a "release/vX.Y.Z" branch.
            BRANCH="${GITHUB_REF_NAME}"
            TAG="${BRANCH#release/}-dev"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          cd build/install
          zip -r "../../luadch-${{ steps.tag.outputs.tag }}-windows-x86_64.zip" luadch

      - uses: actions/upload-artifact@v4
        with:
          name: luadch-windows-x86_64
          path: luadch-*-windows-x86_64.zip
          if-no-files-found: error

  build-openwrt:
    name: Build OpenWRT .apk (${{ matrix.label }})
    runs-on: ubuntu-latest
    # Cross-build a router .apk from the OpenWRT 25.12.x SDK (per target).
    # apk-only: the whole 25.12.x line uses apk; 24.10-and-older (opkg/.ipk)
    # operators install manually per docs/BUILDING.md. Little-endian targets
    # only (adclib Tiger is LE-only) - no big-endian in this matrix. Follow-up
    # to #568 / #587. Recipe validated end-to-end under the WSL SDK lab for all
    # three arches before this landed.
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm_cortex-a9_vfpv3-d16 - Linksys WRT3200ACM etc. (confirmed device).
          - target: mvebu/cortexa9
            label: mvebu-cortexa9
            sdk: openwrt-sdk-25.12.5-mvebu-cortexa9_gcc-14.3.0_musl_eabi.Linux-x86_64.tar.zst
          # mipsel_24kc - the most common home-router SoC family (mt7621).
          - target: ramips/mt7621
            label: ramips-mt7621
            sdk: openwrt-sdk-25.12.5-ramips-mt7621_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          # aarch64_cortex-a53 - the most common aarch64 OpenWRT base
          # (Belkin RT3200 / Linksys E8450 and kin).
          - target: mediatek/mt7622
            label: mediatek-mt7622
            sdk: openwrt-sdk-25.12.5-mediatek-mt7622_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    env:
      # Pinned OpenWRT release. Bump alongside the SDK filenames above when a
      # newer 25.12.x (or a future apk-based line) lands. Kept as a build input
      # like OPENSSL_VERSION / CMAKE_VERSION elsewhere in this file.
      OPENWRT_RELEASE: 25.12.5
    steps:
      - uses: actions/checkout@v4

      # The OpenWRT package (openwrt/luadch-ng) is a 3.2.x+ feature and does not
      # exist on the 3.1.x maintenance line. Detect its absence and turn every
      # build step below into a no-op so the job stays GREEN there - otherwise a
      # 3.1.x tag push would fail this job and, via `release: needs`, block the
      # entire 3.1.x security release.
      - name: Check package present
        id: check
        run: |
          if [ -f openwrt/luadch-ng/Makefile ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::openwrt/luadch-ng absent on this ref - skipping the OpenWRT .apk build."
          fi

      - name: Determine version
        id: tag
        if: steps.check.outputs.present == 'true'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            # Branch push: derive "vX.Y.Z-dev" from a "release/vX.Y.Z" branch.
            BRANCH="${GITHUB_REF_NAME}"
            TAG="${BRANCH#release/}-dev"
          fi
          # OpenWRT PKG_VERSION must be dashless: "-" is the reserved
          # -r<release> delimiter and apk's version grammar rejects it. Strip the
          # leading "v" and any pre-release suffix; the full tag is kept only for
          # the human-facing asset filename.
          PKGVER="${TAG#v}"; PKGVER="${PKGVER%%-*}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "pkgver=${PKGVER}" >> "$GITHUB_OUTPUT"

      - name: Install SDK host dependencies
        if: steps.check.outputs.present == 'true'
        # The SDK bundles its own cross-toolchain, but the package build still
        # rebuilds a few host tools and unpacks the .tar.zst. zstd handles the
        # SDK archive; the rest is the OpenWRT-recommended host set trimmed to
        # what a single-package build touches.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev zlib1g-dev gawk gettext \
            git libssl-dev xsltproc rsync wget unzip python3 file zstd

      - name: Cache OpenWRT SDK tarball
        if: steps.check.outputs.present == 'true'
        # The ~200 MB SDK download dominates the job; cache it keyed on the
        # exact filename (which pins release + gcc + target), so re-runs skip
        # the fetch. The openssl/zlib compile is not cached (staging paths are
        # brittle across runs) - a follow-up if job time becomes a problem.
        uses: actions/cache@v4
        with:
          path: dl-cache
          key: openwrt-sdk-${{ matrix.sdk }}

      - name: Fetch + verify + extract SDK
        if: steps.check.outputs.present == 'true'
        env:
          SDK: ${{ matrix.sdk }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dl-cache
          # Fetch <name> from the target dir into <out>, trying both OpenWRT
          # mirrors (downloads first, then archive - point releases eventually
          # move to archive.openwrt.org) with a few retries, so a transient blip
          # does not fail the whole release (the sibling aarch64 job retries
          # apt for the same reason).
          fetch() {
            local name="$1" out="$2" host t
            for host in downloads.openwrt.org archive.openwrt.org; do
              for t in 1 2 3; do
                if wget -q -O "$out" \
                    "https://${host}/releases/${OPENWRT_RELEASE}/targets/${TARGET}/${name}"; then
                  return 0
                fi
                echo "fetch ${name} from ${host} failed (try ${t}); retrying in 5s..."
                sleep 5
              done
            done
            return 1
          }
          # Verify the SDK against the checksum OpenWRT publishes next to it -
          # the same integrity bar the CMake/OpenSSL downloads in this file meet
          # (this component generates the shipped machine code, so it must be
          # checked). --ignore-missing checks only files present in dl-cache.
          verify() { ( cd dl-cache && sha256sum --ignore-missing -c sha256sums ); }
          fetch sha256sums dl-cache/sha256sums
          # Re-download when the cached tarball is absent OR fails the checksum
          # (a partial/corrupt cache entry can otherwise brick the arch forever,
          # since actions/cache saves even on a failed run). Download to .part
          # and rename only on success so a truncated file is never promoted.
          if [ ! -f "dl-cache/${SDK}" ] || ! verify; then
            fetch "${SDK}" "dl-cache/${SDK}.part"
            mv "dl-cache/${SDK}.part" "dl-cache/${SDK}"
          fi
          verify
          mkdir -p sdk
          tar --zstd -xf "dl-cache/${SDK}" -C sdk --strip-components=1

      - name: Stage package recipe + source tarball
        if: steps.check.outputs.present == 'true'
        env:
          PKGVER: ${{ steps.tag.outputs.pkgver }}
        # Copy our out-of-tree package into the SDK, pin its version in the
        # Makefile (NOT via a global PKG_VERSION env: that leaks into every
        # package's Makefile in the SDK tree and pulls an unbuildable
        # package/kernel/linux), and pre-stage the source tarball into the SDK's
        # dl/ so the Makefile's codeload fetch is skipped entirely (hermetic: we
        # ship exactly this checkout). The tarball top dir must be
        # luadch-ng-<ver>/ to match PKG_BUILD_DIR.
        run: |
          cp -r openwrt/luadch-ng sdk/package/luadch-ng
          sed -i "s/^PKG_VERSION?=.*/PKG_VERSION:=${PKGVER}/" sdk/package/luadch-ng/Makefile
          mkdir -p sdk/dl
          git archive --format=tar.gz --prefix="luadch-ng-${PKGVER}/" \
            -o "sdk/dl/luadch-ng-${PKGVER}.tar.gz" HEAD

      - name: Build .apk
        if: steps.check.outputs.present == 'true'
        working-directory: sdk
        env:
          # OpenWRT's gcc wrapper refuses to run without STAGING_DIR set. (Do
          # NOT add PKG_VERSION here - see the Stage step's note.)
          STAGING_DIR: ${{ github.workspace }}/sdk/staging_dir
        run: |
          # The ncurses "build dependency" is menuconfig-only; bypass its check
          # with an empty prereq stamp (FORCE=1 does NOT skip it). A freshly
          # extracted SDK has no host/ dir yet, so create it first.
          mkdir -p host && touch host/.prereq-build
          ./scripts/feeds update base
          ./scripts/feeds install -p base libopenssl zlib
          make defconfig
          echo "CONFIG_PACKAGE_luadch-ng=m" >> .config
          make defconfig
          make package/luadch-ng/compile -j"$(nproc)"

      - name: Collect + rename .apk
        if: steps.check.outputs.present == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # bin/packages/<pkgarch>/base/luadch-ng-<ver>-r<rel>.apk; the arch is
          # not in the default name, so rename per-arch to avoid a collision
          # when the release job merges all matrix artifacts into one dir.
          # -print -quit stops find at the first hit (no head|SIGPIPE under the
          # runner's pipefail).
          BUILT=$(find sdk/bin -name 'luadch-ng-*.apk' -print -quit)
          test -n "${BUILT}"
          PKGARCH=$(basename "$(dirname "$(dirname "${BUILT}")")")
          OUT="luadch-ng-${TAG}-openwrt-${PKGARCH}.apk"
          cp "${BUILT}" "${OUT}"
          ls -la "${OUT}"

      - uses: actions/upload-artifact@v4
        if: steps.check.outputs.present == 'true'
        with:
          name: luadch-ng-openwrt-${{ matrix.label }}
          path: luadch-ng-*-openwrt-*.apk
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build-linux, build-linux-aarch64, build-windows, build-openwrt]
    runs-on: ubuntu-latest
    # Only this job needs write (to create the release); see the top-level
    # `permissions: contents: read`.
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: .github/release-body.md
          draft: false
          fail_on_unmatched_files: true
